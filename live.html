<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Live Preview | REVOLVYN</title>
	<link rel="icon" href="favicon.png" type="image/png" sizes="any">
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#000000">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		*, *::before, *::after {
			margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
			-webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important;
			-webkit-touch-callout: none !important;
		}
		input, textarea, [contenteditable] { -webkit-user-select: text !important; user-select: text !important; }
		img, video { -webkit-user-drag: none !important; user-drag: none !important; }
		html, body { height: 100%; background: #080a06; color: #e8ece4; font-family: 'Inter', sans-serif; overflow: hidden; }
		::selection { background: transparent; }

		.live-shell { display: flex; flex-direction: column; height: 100%; width: 100%; }

		/* Luxury Live Bar */
		.live-bar {
			display: flex; align-items: center; justify-content: space-between; gap: 14px;
			padding: 12px 24px; background: rgba(14, 18, 12, 0.94);
			border-bottom: 1px solid rgba(230, 245, 120, 0.16);
			backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
			z-index: 50; flex-shrink: 0;
		}
		.live-bar-left { display: flex; align-items: center; gap: 14px; }
		.live-back {
			display: inline-flex; align-items: center; gap: 7px;
			padding: 7px 15px; border-radius: 999px;
			border: 1px solid rgba(230, 245, 120, 0.35);
			background: rgba(230, 245, 120, 0.08);
			color: #e6f578; text-decoration: none;
			font-size: 11.5px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 600;
			transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
			cursor: pointer;
		}
		.live-back:hover { background: #e6f578; color: #000; border-color: #e6f578; transform: translateX(-2px); }
		.live-back svg { transition: transform 0.2s; }
		.live-back:hover svg { transform: translateX(-2px); }

		.live-title-wrap { display: flex; align-items: center; gap: 10px; }
		.live-pulse {
			width: 8px; height: 8px; border-radius: 50%;
			background: #e6f578;
			box-shadow: 0 0 0 0 rgba(230, 245, 120, 0.6);
			animation: livePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
		@keyframes livePulse {
			0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230, 245, 120, 0.7); }
			70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(230, 245, 120, 0); }
			100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230, 245, 120, 0); }
		}
		.live-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; color: #f8fcf0; letter-spacing: 0.3px; }
		.live-badge { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(230,245,120,0.85); font-weight: 600; }

		/* Center Device Switcher */
		.live-devices { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.1); }
		.live-dev-btn {
			display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
			font-size: 11.5px; letter-spacing: 0.8px; text-transform: uppercase; color: #aaa; font-weight: 600;
			border: none; background: none; cursor: pointer; transition: all 0.2s;
		}
		.live-dev-btn:hover { color: #fff; }
		.live-dev-btn.active { background: #e6f578; color: #000; box-shadow: 0 2px 10px rgba(230,245,120,0.3); }

		/* Right Actions */
		.live-actions { display: flex; align-items: center; gap: 10px; }
		.live-open-tab-btn {
			display: inline-flex; align-items: center; gap: 7px;
			padding: 7px 16px; border-radius: 999px;
			background: linear-gradient(135deg, #e6f578, #b4dc64);
			color: #000; font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
			text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
		}
		.live-open-tab-btn:hover { transform: scale(1.04); box-shadow: 0 4px 16px rgba(230,245,120,0.35); }

		/* Viewport Area */
		.live-viewport-wrap {
			flex: 1; min-height: 0; background: #050704;
			display: flex; align-items: center; justify-content: center;
			overflow: hidden; padding: 14px; position: relative;
		}
		.live-frame-shell {
			width: 100%; height: 100%; max-width: 100%;
			background: #000; border: 1px solid rgba(255,255,255,0.1);
			border-radius: 12px; overflow: hidden; position: relative;
			box-shadow: 0 20px 60px rgba(0,0,0,0.7);
			transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.35s ease, border 0.35s ease;
		}
		.live-frame-shell[data-device="tablet"] {
			width: 780px; border-radius: 24px; border: 3px solid rgba(255,255,255,0.18);
			box-shadow: 0 25px 70px rgba(0,0,0,0.85);
		}
		.live-frame-shell[data-device="mobile"] {
			width: 396px; border-radius: 36px; border: 4px solid rgba(255,255,255,0.22);
			box-shadow: 0 25px 70px rgba(0,0,0,0.85);
		}

		.live-stage { width: 100%; height: 100%; position: relative; background: #000; }
		.live-stage iframe, .live-stage video { width: 100%; height: 100%; border: 0; display: block; object-fit: contain; }

		/* Loading Overlay */
		.live-loader {
			position: absolute; inset: 0;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			gap: 14px; color: rgba(230, 245, 120, 0.9); font-size: 13.5px; font-weight: 500;
			letter-spacing: 0.5px; background: #070905; z-index: 10;
			transition: opacity 0.28s ease, visibility 0.28s;
		}
		.live-spinner {
			width: 32px; height: 32px; border-radius: 50%;
			border: 2px solid rgba(230, 245, 120, 0.2);
			border-top-color: #e6f578;
			animation: lpSpin 0.75s linear infinite;
		}
		@keyframes lpSpin { to { transform: rotate(360deg); } }

		@media (max-width: 860px) {
			.live-bar { padding: 10px 14px; }
			.live-title-wrap span:last-child { display: none; }
			.live-devices { display: none; }
		}
	</style>
</head>
<body>
	<div class="live-shell">
		<header class="live-bar">
			<div class="live-bar-left">
				<a href="portfolio.html?tab=websites" class="live-back" id="liveBack">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
					<span>Back</span>
				</a>
				<div class="live-title-wrap">
					<span class="live-pulse" aria-hidden="true"></span>
					<span class="live-title" id="liveTitle">REVOLVYN Live Site</span>
					<span class="live-badge">Live Interactive</span>
				</div>
			</div>

			<div class="live-devices" role="group" aria-label="Device simulation">
				<button type="button" class="live-dev-btn active" data-device="desktop">Desktop</button>
				<button type="button" class="live-dev-btn" data-device="tablet">Tablet</button>
				<button type="button" class="live-dev-btn" data-device="mobile">Mobile</button>
			</div>

			<div class="live-actions">
				<a href="#" target="_blank" rel="noopener" class="live-open-tab-btn" id="liveOpenTabBtn">
					<span>Open New Tab</span>
					<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
				</a>
			</div>
		</header>

		<main class="live-viewport-wrap">
			<div class="live-frame-shell" id="liveFrameShell" data-device="desktop">
				<div class="live-stage" id="liveStage">
					<div class="live-loader" id="liveLoader">
						<div class="live-spinner"></div>
						<span>Connecting to interactive preview…</span>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script src="portfolio/websites/catalog.js"></script>
	<script>
		const sites = window.REVOLVYN_WEBSITES || [];
		const slug = new URLSearchParams(window.location.search).get('slug');
		const site = sites.find(s => s.slug === slug) || sites[0];

		const liveBack = document.getElementById('liveBack');
		const liveTitle = document.getElementById('liveTitle');
		const liveOpenTabBtn = document.getElementById('liveOpenTabBtn');
		const liveStage = document.getElementById('liveStage');
		const liveLoader = document.getElementById('liveLoader');
		const liveFrameShell = document.getElementById('liveFrameShell');

		if (site) {
			document.title = `${site.title} — Interactive Live Preview | REVOLVYN`;
			liveTitle.textContent = site.fullTitle || site.title;
			liveBack.href = `website.html?slug=${site.slug}`;

			const targetUrl = site.liveUrl || '';
			if (targetUrl) {
				liveOpenTabBtn.href = targetUrl;

				const iframe = document.createElement('iframe');
				iframe.src = targetUrl;
				iframe.title = `${site.title} Live Preview`;
				iframe.loading = 'eager';
				iframe.referrerPolicy = 'no-referrer';
				iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
				
				const removeLoader = () => {
					if (liveLoader) {
						liveLoader.style.opacity = '0';
						setTimeout(() => { try { liveLoader.remove(); } catch(e){} }, 280);
					}
				};

				iframe.onload = removeLoader;
				setTimeout(removeLoader, 3000); // Fail-safe fallback
				liveStage.appendChild(iframe);
			} else {
				liveOpenTabBtn.style.display = 'none';
				if (liveLoader) liveLoader.remove();

				const vid = document.createElement('video');
				vid.muted = true; vid.loop = true; vid.playsInline = true; vid.autoplay = true;
				vid.poster = site.thumb || '';
				vid.src = site.video || '';
				vid.setAttribute('controlsList', 'nodownload noplaybackrate nofullscreen');
				vid.oncontextmenu = () => false;
				if (window.bindWebsiteSpeed) window.bindWebsiteSpeed(vid, () => 'adaptive');
				vid.play().catch(() => {});
				liveStage.appendChild(vid);
			}
		}

		// Device Mode Switching
		document.querySelectorAll('.live-dev-btn').forEach(btn => {
			btn.addEventListener('click', () => {
				document.querySelectorAll('.live-dev-btn').forEach(b => b.classList.remove('active'));
				btn.classList.add('active');
				liveFrameShell.setAttribute('data-device', btn.dataset.device);
			});
		});

		// Global Security & Anti-Download Protection
		document.addEventListener('contextmenu', (e) => {
			const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
			if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
		}, { capture: true });

		document.addEventListener('dragstart', (e) => {
			const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
			if (tag === 'IMG' || tag === 'VIDEO' || tag === 'A') e.preventDefault();
		}, { capture: true });

		document.addEventListener('keydown', (e) => {
			if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) {
				e.preventDefault();
			}
		});
	</script>
</body>
</html>
